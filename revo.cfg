# REVO configuration file.
# Only `feature_names` is required. All other parameters fall back to the defaults shown here if not specified.
#
# distance_metric options:
#   adaptive_sigma (default)   - sigma updated between iterations, fixed within each iteration
#   zscore                     - fresh sigma computed from ensemble each iteration
#   fixed                      - user-supplied sigma_fixed list, never changes
#   euclidean                  - raw Euclidean, no normalization
#   my_module.MyDistance       - any fully-qualified class path; the class must subclass
#                                DistanceMetric and its __init__ receives the full config
#                                dict as keyword arguments (**kwargs absorbs unused keys)
feature_names:
  - feature_0
  - feature_1

pmin: 1.0e-12
pmax: 0.1
dist_exponent: 4
merge_dist_fraction: 0.5
use_weights: true
merge_alg: pairs
distance_metric: adaptive_sigma
sigma_update_rate: 0.1
importance: null
